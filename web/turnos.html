<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnos - VetCare</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/pages.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
    <div id="header-container"></div>
    <div id="sidebar-container"></div>
    <main class="main-content container-fluid p-4">
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="dashboard.html" class="text-decoration-none">Dashboard</a></li>
                <li class="breadcrumb-item active" aria-current="page">Turnos</li>
            </ol>
        </nav>

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <h1 class="h3 fw-bold text-dark mb-0">Gestión de Turnos</h1>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modal-turno">
                <i class="bi bi-calendar-plus me-2"></i>Nuevo Turno
            </button>
        </div>

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-white border-bottom-0 pt-3 pb-0">
                <ul class="nav nav-tabs border-bottom" id="turnosTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="tab-todos" data-filtro="todos" type="button" role="tab">Todos</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="tab-hoy" data-filtro="hoy" type="button" role="tab">Hoy</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="tab-proximos" data-filtro="proximos" type="button" role="tab">Próximos</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="tab-pasados" data-filtro="pasados" type="button" role="tab">Pasados</button>
                    </li>
                </ul>
            </div>
            <div class="card-body p-0">
                <div class="p-3 bg-light border-bottom d-flex gap-2">
                    <select class="form-select form-select-sm" style="max-width: 200px;" id="filtro-estado">
                        <option value="">Todos los estados</option>
                        <option value="Pendiente">Pendiente</option>
                        <option value="Confirmado">Confirmado</option>
                        <option value="Cancelado">Cancelado</option>
                        <option value="Realizado">Realizado</option>
                    </select>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Fecha y Hora</th>
                                <th>Mascota</th>
                                <th>Propietario</th>
                                <th>Motivo</th>
                                <th>Estado</th>
                                <th class="text-end pe-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="turnos-tbody">
                            <!-- JS inserta turnos -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <footer id="footer-container"></footer>

    <!-- Modal Nuevo Turno -->
    <div class="modal fade" id="modal-turno" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Nuevo Turno</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="form-turno">
                        <div class="mb-3">
                            <label class="form-label">Mascota <span class="text-danger">*</span></label>
                            <select class="form-select" id="turno-mascota" required>
                                <option value="">Seleccione mascota...</option>
                                <option value="1">Luna (Perro) - Juan Pérez</option>
                                <option value="2">Milo (Gato) - Juan Pérez</option>
                            </select>
                        </div>
                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label">Fecha <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="turno-fecha" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Hora <span class="text-danger">*</span></label>
                                <input type="time" class="form-control" id="turno-hora" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Motivo <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="turno-motivo" rows="2" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Profesional</label>
                            <input type="text" class="form-control" id="turno-profesional" value="Dr. Actual">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btn-guardar-turno">Crear turno</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="utils/validators.js"></script>
    <script src="utils/formatters.js"></script>
    <script src="utils/mock-data.js"></script>
    <script src="services/api.js"></script>
    <script src="assets/js/app.js"></script>
    
    <script src="components/header.js"></script>
    <script src="components/sidebar.js"></script>
    <script src="components/footer.js"></script>
    <script src="components/toast.js"></script>
    
    <script src="pages/turnos.js"></script>
</body>
</html>
