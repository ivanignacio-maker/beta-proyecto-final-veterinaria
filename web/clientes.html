<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - VetCare</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/pages.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
    <div id="header-container"></div>
    <div id="sidebar-container"></div>
    <main class="main-content container-fluid p-4">
        <!-- Breadcrumbs -->
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="dashboard.html" class="text-decoration-none">Dashboard</a></li>
                <li class="breadcrumb-item active" aria-current="page">Clientes</li>
            </ol>
        </nav>

        <!-- Encabezado y búsqueda -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <h1 class="h3 fw-bold text-dark mb-0">Gestión de Clientes</h1>
            
            <div class="search-box d-flex gap-2">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                    <input type="text" id="input-buscar" class="form-control border-start-0 ps-0" placeholder="Buscar por nombre, DNI o email..." aria-label="Buscar cliente">
                </div>
                <button class="btn btn-primary d-none d-md-block" id="btn-buscar">Buscar</button>
            </div>
        </div>

        <!-- Contenedor principal de la tabla -->
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive" id="clientes-table-container">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light text-muted">
                            <tr>
                                <th scope="col" class="ps-4">Nombre Completo</th>
                                <th scope="col">DNI</th>
                                <th scope="col">Contacto</th>
                                <th scope="col" class="text-center">Mascotas</th>
                                <th scope="col" class="text-end pe-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="clientes-tbody">
                            <!-- El contenido se renderiza por JS -->
                            <tr>
                                <td colspan="5" class="text-center py-5">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Cargando clientes...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- Paginación -->
                <div class="d-flex justify-content-between align-items-center p-3 border-top">
                    <span class="text-muted small" id="paginacion-info">Mostrando 0 de 0 clientes</span>
                    <nav aria-label="Paginación de clientes">
                        <ul class="pagination pagination-sm mb-0" id="paginacion-ul">
                            <li class="page-item disabled"><a class="page-link" href="#">Anterior</a></li>
                            <li class="page-item active"><a class="page-link" href="#">1</a></li>
                            <li class="page-item disabled"><a class="page-link" href="#">Siguiente</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </main>
    <footer id="footer-container"></footer>

    <!-- Scripts Base -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="utils/validators.js"></script>
    <script src="utils/formatters.js"></script>
    <script src="utils/mock-data.js"></script>
    <script src="services/api.js"></script>
    <script src="assets/js/app.js"></script>
    
    <!-- Componentes -->
    <script src="components/header.js"></script>
    <script src="components/sidebar.js"></script>
    <script src="components/footer.js"></script>
    <script src="components/toast.js"></script>
    
    <!-- Script de Página -->
    <script src="pages/clientes.js"></script>
</body>
</html>
