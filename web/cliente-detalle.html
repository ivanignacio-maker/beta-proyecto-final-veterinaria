<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Cliente - VetCare</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/pages.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
    <div id="header-container"></div>
    <div id="sidebar-container"></div>
    <main class="main-content container-fluid p-4">
        <!-- Breadcrumbs -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="dashboard.html" class="text-decoration-none">Dashboard</a></li>
                <li class="breadcrumb-item"><a href="clientes.html" class="text-decoration-none">Clientes</a></li>
                <li class="breadcrumb-item active" aria-current="page" id="breadcrumb-nombre">Detalle</li>
            </ol>
        </nav>

        <div id="loading-container" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="mt-2 text-muted">Cargando información del cliente...</p>
        </div>

        <div id="content-container" style="display: none;">
            <div class="row g-4 mb-4">
                <!-- Tarjeta Datos del Cliente -->
                <div class="col-12 col-xl-4">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-header bg-white border-0 pt-4 pb-0 text-center">
                            <div class="rounded-circle bg-primary-light text-primary d-inline-flex justify-content-center align-items-center mb-3 fw-bold fs-1" style="width: 100px; height: 100px;" id="cliente-iniciales">
                                --
                            </div>
                            <h1 class="h4 fw-bold text-dark mb-1" id="cliente-nombre">Cargando...</h1>
                            <p class="text-muted mb-0">Cliente desde <span id="cliente-registro">--</span></p>
                        </div>
                        <div class="card-body">
                            <hr class="text-muted">
                            <h5 class="fw-bold mb-3">Información Personal</h5>
                            
                            <ul class="list-unstyled">
                                <li class="mb-3 d-flex">
                                    <i class="bi bi-person-badge text-primary me-3 fs-5"></i>
                                    <div>
                                        <small class="text-muted d-block">DNI / Documento</small>
                                        <span class="fw-semibold" id="cliente-dni">--</span>
                                    </div>
                                </li>
                                <li class="mb-3 d-flex">
                                    <i class="bi bi-envelope text-primary me-3 fs-5"></i>
                                    <div>
                                        <small class="text-muted d-block">Correo Electrónico</small>
                                        <span class="fw-semibold" id="cliente-email">--</span>
                                    </div>
                                </li>
                                <li class="mb-3 d-flex">
                                    <i class="bi bi-telephone text-primary me-3 fs-5"></i>
                                    <div>
                                        <small class="text-muted d-block">Teléfono</small>
                                        <span class="fw-semibold" id="cliente-telefono">--</span>
                                    </div>
                                </li>
                                <li class="mb-3 d-flex">
                                    <i class="bi bi-geo-alt text-primary me-3 fs-5"></i>
                                    <div>
                                        <small class="text-muted d-block">Dirección</small>
                                        <span class="fw-semibold" id="cliente-direccion">--</span>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- Mascotas del Cliente -->
                <div class="col-12 col-xl-8">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="h4 fw-bold text-dark mb-0">Mascotas (<span id="count-mascotas">0</span>)</h2>
                    </div>
                    
                    <div class="row g-3" id="mascotas-container">
                        <!-- Las mascotas se renderizan aquí -->
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer id="footer-container"></footer>

    <!-- Scripts Base -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="utils/validators.js"></script>
    <script src="utils/formatters.js"></script>
    <script src="utils/mock-data.js"></script>
    <script src="services/api.js"></script>
    <script src="assets/js/app.js"></script>
    
    <!-- Componentes -->
    <script src="components/header.js"></script>
    <script src="components/sidebar.js"></script>
    <script src="components/footer.js"></script>
    <script src="components/toast.js"></script>
    
    <!-- Script de Página -->
    <script src="pages/cliente-detalle.js"></script>
</body>
</html>
