<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascotas - VetCare</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/pages.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
    <div id="header-container"></div>
    <div id="sidebar-container"></div>
    <main class="main-content container-fluid p-4">
        <!-- Breadcrumbs -->
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="dashboard.html" class="text-decoration-none">Dashboard</a></li>
                <li class="breadcrumb-item active" aria-current="page">Mascotas</li>
            </ol>
        </nav>

        <!-- Encabezado y búsqueda -->
        <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center mb-4 gap-3">
            <h1 class="h3 fw-bold text-dark mb-0">Directorio de Mascotas</h1>
            
            <div class="d-flex flex-column flex-sm-row gap-2">
                <select id="filtro-tipo" class="form-select" style="min-width: 150px;">
                    <option value="">Todos los tipos</option>
                    <option value="Perro">Perro</option>
                    <option value="Gato">Gato</option>
                    <option value="Conejo">Conejo</option>
                    <option value="Ave">Ave</option>
                    <option value="Otro">Otro</option>
                </select>
                
                <div class="input-group" style="min-width: 300px;">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                    <input type="text" id="input-buscar" class="form-control border-start-0 ps-0" placeholder="Buscar por nombre o propietario...">
                </div>
                
                <div class="btn-group" role="group">
                    <input type="radio" class="btn-check" name="btnradio" id="btn-vista-tabla" autocomplete="off" checked>
                    <label class="btn btn-outline-secondary" for="btn-vista-tabla" title="Vista de lista"><i class="bi bi-table"></i></label>

                    <input type="radio" class="btn-check" name="btnradio" id="btn-vista-grid" autocomplete="off">
                    <label class="btn btn-outline-secondary" for="btn-vista-grid" title="Vista de tarjetas"><i class="bi bi-grid-3x3-gap"></i></label>
                </div>
            </div>
        </div>

        <!-- Contenedor principal (puede ser tabla o grid) -->
        <div id="mascotas-container">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Cargando mascotas...</span>
                </div>
            </div>
        </div>
        
        <!-- Paginación -->
        <div class="card border-0 shadow-sm mt-3" id="paginacion-container" style="display:none;">
            <div class="card-body p-3 d-flex justify-content-between align-items-center">
                <span class="text-muted small" id="paginacion-info">Mostrando 0 de 0 mascotas</span>
                <nav aria-label="Paginación">
                    <ul class="pagination pagination-sm mb-0" id="paginacion-ul">
                        <!-- Paginación generada por JS -->
                    </ul>
                </nav>
            </div>
        </div>

    </main>
    <footer id="footer-container"></footer>

    <!-- Scripts Base -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="utils/validators.js"></script>
    <script src="utils/formatters.js"></script>
    <script src="utils/mock-data.js"></script>
    <script src="services/api.js"></script>
    <script src="assets/js/app.js"></script>
    
    <!-- Componentes -->
    <script src="components/header.js"></script>
    <script src="components/sidebar.js"></script>
    <script src="components/footer.js"></script>
    <script src="components/toast.js"></script>
    
    <!-- Script de Página -->
    <script src="pages/mascotas.js"></script>
</body>
</html>
