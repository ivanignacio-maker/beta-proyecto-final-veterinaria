<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes de Acceso - VetCare</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/pages.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
    <div id="header-container"></div>
    <div id="sidebar-container"></div>
    <main class="main-content container-fluid p-4">
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="dashboard.html" class="text-decoration-none">Dashboard</a></li>
                <li class="breadcrumb-item active" aria-current="page">Solicitudes de Acceso</li>
            </ol>
        </nav>

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <h1 class="h3 fw-bold text-dark mb-0">Solicitudes de Acceso</h1>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modal-solicitud">
                <i class="bi bi-shield-plus me-2"></i>Nueva Solicitud
            </button>
        </div>

        <ul class="nav nav-tabs mb-4" id="solicitudesTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" data-filtro="Pendiente" type="button">Pendientes</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-filtro="Aprobada" type="button">Aprobadas</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-filtro="Rechazada" type="button">Rechazadas / Revocadas</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-filtro="Todas" type="button">Todas</button>
            </li>
        </ul>

        <div class="row g-4" id="solicitudes-container">
            <!-- JS inserta solicitudes -->
        </div>

    </main>
    <footer id="footer-container"></footer>

    <!-- Modal Nueva Solicitud -->
    <div class="modal fade" id="modal-solicitud" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Nueva Solicitud de Acceso</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-4">
                        <label class="form-label">Buscar Propietario por DNI</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="buscar-dni" placeholder="Ingrese DNI...">
                            <button class="btn btn-outline-primary" type="button" id="btn-buscar-cliente">Buscar</button>
                        </div>
                    </div>

                    <div id="resultado-busqueda" style="display: none;">
                        <h6 class="border-bottom pb-2 mb-3">Cliente: <span class="text-primary" id="res-nombre"></span></h6>
                        <label class="form-label">Seleccione la mascota:</label>
                        <select class="form-select mb-3" id="select-mascota-solicitud">
                            <!-- JS inserta opciones -->
                        </select>
                        <div class="alert alert-info small">
                            Al enviar la solicitud, el propietario recibirá una notificación en su aplicación móvil para aprobar o rechazar el acceso a la historia clínica.
                        </div>
                    </div>
                    
                    <div id="resultado-error" style="display: none;" class="alert alert-warning">
                        No se encontró ningún cliente con ese DNI.
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btn-enviar-solicitud" disabled>Solicitar acceso</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="utils/validators.js"></script>
    <script src="utils/formatters.js"></script>
    <script src="utils/mock-data.js"></script>
    <script src="services/api.js"></script>
    <script src="assets/js/app.js"></script>
    
    <script src="components/header.js"></script>
    <script src="components/sidebar.js"></script>
    <script src="components/footer.js"></script>
    <script src="components/toast.js"></script>
    
    <script src="pages/solicitudes.js"></script>
</body>
</html>
